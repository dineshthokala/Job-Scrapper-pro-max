name: 24/7 Flutter Job Scraper

on:
  schedule:
    # Runs every 3 hours (UTC)
    - cron: "0 */3 * * *"
  # Allows you to manually trigger it anytime from GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Job Scraper
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
        run: |
          # Runs all 24 portals once and sends Discord alerts
          python main.py --once

      - name: Save jobs database (prevent duplicates)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.db
          git diff --staged --quiet || git commit -m "Auto-update jobs.db [skip ci]"
          # Pull remote changes (rebase our db commit on top), resolve binary conflicts
          git pull --rebase origin main || {
            echo "Rebase conflict detected — keeping our jobs.db"
            git checkout --theirs jobs.db 2>/dev/null || git checkout --ours jobs.db
            git add jobs.db
            git rebase --continue
          }
          git push
