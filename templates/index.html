<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Real-time job scraper dashboard — monitor LinkedIn, Naukri, Internshala and more.">
    <title>Job Scraper Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
</head>
<body>

<div class="app-container">

    <!-- ═══ Header ═══════════════════════════════════════════════════ -->
    <header class="header fade-in">
        <div class="header-brand">
            <div class="header-logo">🔍</div>
            <div>
                <h1 class="header-title">Job Scraper</h1>
                <div class="header-subtitle">Real-time multi-portal job tracker</div>
            </div>
        </div>
        <div class="header-actions">
            <div class="status-badge" id="scrapeStatus">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Idle</span>
            </div>
            <span class="status-badge" id="lastRunBadge" style="display:none;">
                Last: <span id="lastRunTime"></span>
            </span>
            <button class="btn btn-primary" id="scrapeBtn" onclick="triggerScrape()">
                ⚡ Run Scrape
            </button>
        </div>
    </header>

    <!-- ═══ Stats Row ════════════════════════════════════════════════ -->
    <section class="stats-row" id="statsRow">
        <div class="stat-card fade-in fade-in-delay-1">
            <div class="stat-label">Total Jobs</div>
            <div class="stat-value" id="statTotal">—</div>
            <div class="source-chips" id="sourceChips"></div>
        </div>
        <div class="stat-card fade-in fade-in-delay-2">
            <div class="stat-label">New Today</div>
            <div class="stat-value accent" id="statToday">—</div>
            <div class="stat-detail">Found in last 24 hours</div>
        </div>
        <div class="stat-card fade-in fade-in-delay-3">
            <div class="stat-label">Saved</div>
            <div class="stat-value green" id="statSaved">—</div>
            <div class="stat-detail">Bookmarked for review</div>
        </div>
        <div class="stat-card fade-in fade-in-delay-4">
            <div class="stat-label">Applied</div>
            <div class="stat-value amber" id="statApplied">—</div>
            <div class="stat-detail" id="statInterviewing">—</div>
        </div>
    </section>

    <!-- ═══ Jobs Card ════════════════════════════════════════════════ -->
    <section class="card fade-in" id="jobsCard" style="animation-delay:0.25s">
        <div class="card-header">
            <div class="card-title">
                📋 Jobs
                <span id="jobCount" style="font-weight:400;color:var(--text-muted);font-size:0.8rem;"></span>
            </div>
        </div>

        <!-- Filters -->
        <div class="card-body" style="padding-bottom:0">
            <div class="filters-bar">
                <input type="text" class="filter-input" id="searchInput" placeholder="Search titles, companies..." oninput="debouncedFetch()">
                <select class="filter-select" id="sourceFilter" onchange="fetchJobs()">
                    <option value="">All Sources</option>
                </select>
                <select class="filter-select" id="statusFilter" onchange="fetchJobs()">
                    <option value="">All Statuses</option>
                    <option value="new">🔵 New</option>
                    <option value="saved">🟣 Saved</option>
                    <option value="applied">🟡 Applied</option>
                    <option value="interviewing">🟠 Interviewing</option>
                    <option value="rejected">🔴 Rejected</option>
                    <option value="offer">🟢 Offer</option>
                </select>
                <select class="filter-select" id="keywordFilter" onchange="fetchJobs()">
                    <option value="">All Keywords</option>
                </select>
                <div class="filters-right">
                    <button class="btn btn-sm" onclick="exportCSV()">📥 Export CSV</button>
                    <button class="btn btn-sm" onclick="resetFilters()">✕ Clear</button>
                </div>
            </div>
        </div>

        <!-- Table -->
        <div class="table-wrap">
            <table class="job-table" id="jobTable">
                <thead>
                    <tr>
                        <th data-sort="source">Source <span class="sort-arrow">▲</span></th>
                        <th data-sort="title">Title <span class="sort-arrow">▲</span></th>
                        <th data-sort="company">Company <span class="sort-arrow">▲</span></th>
                        <th>Location</th>
                        <th>Keyword</th>
                        <th data-sort="found_at" class="sorted">Found <span class="sort-arrow">▼</span></th>
                        <th data-sort="status">Status <span class="sort-arrow">▲</span></th>
                        <th>Notes</th>
                    </tr>
                </thead>
                <tbody id="jobTableBody">
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>

        <!-- Empty state (hidden by default) -->
        <div class="empty-state" id="emptyState" style="display:none">
            <div class="empty-state-icon">📭</div>
            <div class="empty-state-text">No jobs found</div>
            <div class="empty-state-hint">Run a scrape or adjust your filters</div>
        </div>

        <!-- Pagination -->
        <div class="pagination" id="pagination">
            <div class="pagination-info">
                Showing <strong id="pageFrom">0</strong>–<strong id="pageTo">0</strong> of <strong id="pageTotal">0</strong>
            </div>
            <div class="pagination-buttons" id="pageButtons"></div>
        </div>
    </section>

    <!-- ═══ Live Log Terminal ═════════════════════════════════════════ -->
    <section class="terminal-section fade-in" style="animation-delay:0.35s">
        <button class="terminal-toggle" id="termToggle" onclick="toggleTerminal()">
            <span class="arrow">▼</span>
            🖥️ Live Scraper Log
            <span id="logCount" style="margin-left:auto;font-size:0.72rem;color:var(--text-muted);font-weight:400;"></span>
        </button>
        <div class="terminal-body" id="termBody">
            <div class="terminal-output" id="termOutput"></div>
        </div>
    </section>

</div>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<script src="/static/app.js"></script>
</body>
</html>
